[project]
name = "brightspace-blueprint-packager"
dynamic = ["version"]
description = "Turns a flat course blueprint into a Brightspace import package, with receipts at every stage."
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1,<2", "lxml>=5,<7", "openpyxl>=3.1,<4", "jsonschema>=4.17,<5", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["blueprint_packager"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "blueprint_packager.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
